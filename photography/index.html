  .photo-nav.prev {

  .photo-nav span {

  .photo-nav.zoom {

  .photo-zoom-overlay.open {

  }

    max-height: 95vh;
    border-radius: 6px;
  }
  .photo-thumbs {
    display: flex;

    overflow-x: auto;

    height: 65px;
    object-fit: cover;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0.55;
    flex-shrink: 0;
  }

</style> <div class="photo-viewer-wrap"> <div class="photo-viewer"> <img id="photo-main" src="/assets/img/photography/1.jpg" alt="photo 1"> <button class="photo-nav prev" aria-label="previous photo" title="Previous photo"><span>❮</span></button> <button class="photo-nav zoom" aria-label="zoom in" title="Zoom in"></button> <button class="photo-nav next" aria-label="next photo" title="Next photo"><span>❯</span></button> </div> </div> <div id="photo-zoom-overlay" class="photo-zoom-overlay"> <img id="photo-zoom-img" alt=""> </div> <div class="photo-thumbs"> <img src="/assets/img/photography/1.jpg" data-index="0" class="active" alt="thumbnail 1"> <img src="/assets/img/photography/2.jpg" data-index="1" class="" alt="thumbnail 2"> <img src="/assets/img/photography/3.jpg" data-index="2" class="" alt="thumbnail 3"> <img src="/assets/img/photography/4.jpg" data-index="3" class="" alt="thumbnail 4"> <img src="/assets/img/photography/5.jpg" data-index="4" class="" alt="thumbnail 5"> <img src="/assets/img/photography/6.jpg" data-index="5" class="" alt="thumbnail 6"> <img src="/assets/img/photography/7.png" data-index="6" class="" alt="thumbnail 7"> </div> <script>
  (function () {
    var photos = [
      
        "/assets/img/photography/1.jpg",
      
        "/assets/img/photography/2.jpg",
      
        "/assets/img/photography/3.jpg",
      
        "/assets/img/photography/4.jpg",
      
        "/assets/img/photography/5.jpg",
      
        "/assets/img/photography/6.jpg",
      
        "/assets/img/photography/7.png"
      
    ];
    var current = 0;
    var mainImg = document.getElementById('photo-main');
    var thumbs = document.querySelectorAll('.photo-thumbs img');

    function show(index) {
      current = (index + photos.length) % photos.length;
      mainImg.src = photos[current];
      mainImg.alt = 'photo ' + (current + 1);
      thumbs.forEach(function (thumb, i) {
        thumb.classList.toggle('active', i === current);
      });
    }

    document.querySelector('.photo-nav.prev').addEventListener('click', function () {
      show(current - 1);
    });
    document.querySelector('.photo-nav.next').addEventListener('click', function () {
      show(current + 1);
    });
    thumbs.forEach(function (thumb, i) {
      thumb.addEventListener('click', function () {
        show(i);
      });
    });

    var overlay = document.getElementById('photo-zoom-overlay');
    var zoomImg = document.getElementById('photo-zoom-img');

    function openZoom() {
      zoomImg.src = photos[current];
      zoomImg.alt = mainImg.alt;
      overlay.classList.add('open');
    }
    function closeZoom() {
      overlay.classList.remove('open');
    }

    document.querySelector('.photo-nav.zoom').addEventListener('click', openZoom);
    overlay.addEventListener('click', closeZoom);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') show(current - 1);
      if (e.key === 'ArrowRight') show(current + 1);
      if (e.key === 'Escape') closeZoom();
    });
  })();
</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Hongyi Liu. Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. Hosted by <a href="https://pages.github.com/" target="_blank" rel="external nofollow noopener">GitHub Pages</a>. </div> </footer> <script>
